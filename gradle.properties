# The generated declarations are laid out by a local IntelliJ IDEA — see `formatDeclarations` in the
# `mui-declarations` convention plugin — so an installation is a build requirement. It is found
# automatically in ~/Applications and /Applications; set `idea.home` in ~/.gradle/gradle.properties, or
# pass -Pidea.home=…, to name a different one. No value here: it is machine-specific and this file is
# committed. Unlike a pinned formatter version, the layout now follows whatever IDEA is installed, so an
# IDE upgrade can legitimately change the tree; the committed one was produced by IU-262 (IDEA 2026.2),
# and every run logs the build it used.
